<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Roster" />
  <title>Summer Roster</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <!-- Swapped to an athletic, bold font pairing -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overscroll-behavior: none; font-family: 'Inter', system-ui, sans-serif; background-color: #f1f5f9; }
    
    /* Custom sports typography class */
    .sports-header { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }

    @keyframes confettiFall {
      0% { opacity:1; transform:translateY(0) rotate(0deg); }
      100% { opacity:0; transform:translateY(100vh) rotate(720deg); }
    }
    @keyframes bounceCheck {
      0% { transform:scale(1); } 30% { transform:scale(1.15); }
      60% { transform:scale(0.95); } 100% { transform:scale(1); }
    }
    @keyframes slideUp {
      from { transform:translateY(100%); opacity:0; }
      to { transform:translateY(0); opacity:1; }
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(4px); }
      to { opacity:1; transform:translateY(0); }
    }
    .check-bounce { animation: bounceCheck 0.35s ease-out; }
    .modal-slide { animation: slideUp 0.3s ease-out; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    textarea, input { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    const EMAILJS_SERVICE = "service_mook8qu";
    const EMAILJS_TEMPLATE = "template_rycm9b9";
    const EMAILJS_KEY = "KCqlHAMxAUFGexY2A";

    const getToday = () => {
      const d = new Date();
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    };
    const formatDate = () =>
      new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

    const load = (k,fb) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):fb; } catch{ return fb; } };
    const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch{} };

    const DEFAULT_PIN = "1234";

    // High-impact athletic color palette
    const BLOCK_COLORS = [
      {bar:"#e11d48"}, // Bold Red
      {bar:"#ea580c"}, // Vibrant Orange
      {bar:"#059669"}, // Pitch Green
      {bar:"#2563eb"}, // Stadium Blue
      {bar:"#4f46e5"}, // Indigo
      {bar:"#0f172a"}, // Deep Navy
    ];

    const DEFAULT_BLOCKS = [
      { id:"wake",   time:"8:30 \u2013 9:30",  title:"Pre-Game Routine", desc:"Shower, breakfast, get dressed, brush teeth", gated:false, addable:false },
      { id:"chores", time:"9:30 \u2013 10:00", title:"Base Camp Chores",         desc:"Dishwasher, wipe counters, make beds, daily task", gated:false, addable:true },
      { id:"brain",  time:"10:00 \u2013 11:00",title:"Mental Conditioning",      desc:"Coding, Spanish, or math games", gated:false, addable:true },
      { id:"read",   time:"11:00 \u2013 12:00",title:"Film Room / Reading",      desc:"Downtime with a book \u2014 no devices", gated:false, addable:false },
      { id:"lunch",  time:"12:00 \u2013 1:00", title:"Halftime & Refuel",        desc:"Make lunch, clean up after yourself", gated:false, addable:false },
      { id:"open",   time:"1:00 \u2013 3:30",  title:"Open Training",            desc:"Friends, outside, basketball, board games, Lego, drawing", gated:false, addable:false },
      { id:"screen", time:"3:30 \u2013 4:30",  title:"Screen Time",              desc:"Video games, YouTube, or TV", gated:true, addable:false },
      { id:"family", time:"4:30 onward",       title:"Post-Game / Family Time",  desc:"Dinner, activities, hang out", gated:false, addable:false },
    ];

    const DEFAULT_CONFIG = {
      blocks: DEFAULT_BLOCKS,
      pin: DEFAULT_PIN,
      weekdays: "MATCH DAYS: MON \u2013 FRI",
      parentEmail: "",
      kidName: "",
    };

    /* Icons */
    const I = ({n,s=20,c=""}) => {
      const p = {
        check:<polyline points="20 6 9 17 4 12"/>,
        lock:<React.Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></React.Fragment>,
        settings:<React.Fragment><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></React.Fragment>,
        x:<React.Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></React.Fragment>,
        reset:<React.Fragment><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></React.Fragment>,
        edit:<React.Fragment><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></React.Fragment>,
        trash:<React.Fragment><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></React.Fragment>,
        send:<React.Fragment><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></React.Fragment>,
        plus:<React.Fragment><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></React.Fragment>,
        minus:<line x1="5" y1="12" x2="19" y2="12"/>,
      };
      return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={c}>{p[n]}</svg>;
    };

    /* Confetti */
    function Confetti({show}) {
      if(!show) return null;
      const colors=["#e11d48","#ea580c","#059669","#2563eb","#facc15"];
      return (
        <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
          {Array.from({length:50},(_,i)=>(
            <div key={i} className="absolute" style={{
              left:Math.random()*100+"%",top:"-10px",
              width:10+Math.random()*10,height:10+Math.random()*10,
              backgroundColor:colors[i%colors.length],opacity:0,
              animation:"confettiFall "+(1.5+Math.random()*1)+"s "+Math.random()*0.3+"s ease-out forwards",
              transform:"rotate("+Math.random()*720+"deg)",
            }}/>
          ))}
        </div>
      );
    }

    /* Progress Ring - Updated colors for sports theme */
    function ProgressRing({pct,size=72,stroke=7}) {
      const r=(size-stroke)/2, circ=2*Math.PI*r;
      const offset=circ-(pct/100)*circ;
      const color=pct>=100?"#10b981":pct>=50?"#f59e0b":"#ef4444";
      return (
        <svg width={size} height={size} className="transform -rotate-90">
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#334155" strokeWidth={stroke}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
            strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={offset}
            strokeLinecap="butt" style={{transition:"stroke-dashoffset 0.5s ease, stroke 0.3s"}}/>
          <text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="central"
            fill="#f8fafc" fontWeight="700" fontSize={size*0.28}
            className="sports-header"
            style={{transform:"rotate(90deg)",transformOrigin:"center"}}>
            {Math.round(pct)}%
          </text>
        </svg>
      );
    }

    /* PIN Pad */
    function PinPad({onSuccess,onCancel,correctPin}) {
      const [entry,setEntry] = useState("");
      const [error,setError] = useState(false);
      const press = (n) => {
        if(entry.length>=6) return;
        const next=entry+n; setError(false);
        if(next.length===correctPin.length) {
          if(next===correctPin) onSuccess();
          else { setError(true); setTimeout(()=>{setEntry("");setError(false);},600); }
        } else setEntry(next);
      };
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center" onClick={onCancel}>
          <div className="bg-slate-800 rounded-xl border-2 border-slate-700 p-8 w-80 shadow-2xl modal-slide" onClick={e=>e.stopPropagation()}>
            <h3 className="text-center text-2xl sports-header text-white mb-1">Coach Access</h3>
            <p className="text-center text-sm font-medium text-slate-400 mb-6">ENTER PIN CODE</p>
            <div className="flex justify-center gap-4 mb-8">
              {Array.from({length:correctPin.length},(_,i)=>(
                <div key={i} className={"w-4 h-4 rounded-sm transition-all "+(error?"bg-red-500":i<entry.length?"bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.5)]":"bg-slate-700")}/>
              ))}
            </div>
            <div className="grid grid-cols-3 gap-3 max-w-[260px] mx-auto">
              {[1,2,3,4,5,6,7,8,9].map(n=>(
                <button key={n} onClick={()=>press(String(n))} className="h-14 rounded-lg bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-2xl sports-header text-white transition-all active:scale-95">{n}</button>
              ))}
              <button onClick={onCancel} className="h-14 rounded-lg text-sm font-bold text-slate-400 hover:bg-slate-700 uppercase">Cancel</button>
              <button onClick={()=>press("0")} className="h-14 rounded-lg bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-2xl sports-header text-white transition-all active:scale-95">0</button>
              <button onClick={()=>{setEntry(entry.slice(0,-1));setError(false);}} className="h-14 rounded-lg text-xl text-slate-400 hover:bg-slate-700">&#9003;</button>
            </div>
          </div>
        </div>
      );
    }

    /* Main */
    function App() {
      const today = getToday();
      const dailyKey = "ss-daily-"+today;

      const [config, setConfig] = useState(() => load("ss-config-v6", DEFAULT_CONFIG));
      const [daily, setDaily] = useState(() => load(dailyKey, { checked:[], subtasks:{} }));
      const [showPin, setShowPin] = useState(false);
      const [editing, setEditing] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const [justChecked, setJustChecked] = useState(null);
      const [addingTo, setAddingTo] = useState(null);
      const [newSubText, setNewSubText] = useState("");
      const [emailStatus, setEmailStatus] = useState("idle"); 

      const [editBlocks, setEditBlocks] = useState([]);
      const [editPin, setEditPin] = useState("");
      const [editWeekdays, setEditWeekdays] = useState("");
      const [editEmail, setEditEmail] = useState("");
      const [editName, setEditName] = useState("");
      const [newBlock, setNewBlock] = useState({time:"",title:"",desc:"",gated:false,addable:false});
      const [editingBlockIdx, setEditingBlockIdx] = useState(null);

      const prevPctRef = useRef(0);
      const inputRef = useRef(null);

      const saveConfig = (c) => { setConfig(c); save("ss-config-v6",c); };
      const saveDaily = (d) => { setDaily(d); save(dailyKey,d); };

      const checked = daily.checked || [];
      const subtasks = daily.subtasks || {};
      const nonGated = config.blocks.filter(b=>!b.gated);
      const allNonGatedDone = nonGated.every(b=>checked.includes(b.id));
      const totalBlocks = config.blocks.length;
      const totalDone = checked.length;
      const pct = totalBlocks>0?(totalDone/totalBlocks)*100:0;

      const kidName = config.kidName || "";
      const headerTitle = kidName ? kidName+"'s Roster" : "Daily Roster";

      const toggle = (blockId, isGated) => {
        if(isGated && !allNonGatedDone) return;
        const curr = [...checked];
        const idx = curr.indexOf(blockId);
        if(idx>=0) { curr.splice(idx,1); }
        else {
          curr.push(blockId);
          setJustChecked(blockId);
          setTimeout(()=>setJustChecked(null),500);
        }
        const newDaily = {...daily, checked:curr};
        const newPct = totalBlocks>0?(curr.length/totalBlocks)*100:0;
        if(newPct>=100 && prevPctRef.current<100) {
          setShowConfetti(true);
          setTimeout(()=>setShowConfetti(false),3500);
        }
        prevPctRef.current=newPct;
        saveDaily(newDaily);
      };

      const addSubtask = (blockId) => {
        if(!newSubText.trim()) return;
        const blockSubs = [...(subtasks[blockId]||[])];
        blockSubs.push({ id:"s-"+Date.now(), text:newSubText.trim(), done:false });
        saveDaily({...daily, subtasks:{...subtasks, [blockId]:blockSubs}});
        setNewSubText("");
        setTimeout(()=>inputRef.current&&inputRef.current.focus(),50);
      };

      const toggleSubtask = (blockId, subId) => {
        const blockSubs = (subtasks[blockId]||[]).map(s=>s.id===subId?{...s,done:!s.done}:s);
        saveDaily({...daily, subtasks:{...subtasks, [blockId]:blockSubs}});
      };

      const removeSubtask = (blockId, subId) => {
        const blockSubs = (subtasks[blockId]||[]).filter(s=>s.id!==subId);
        saveDaily({...daily, subtasks:{...subtasks, [blockId]:blockSubs}});
      };

      const resetDay = () => {
        prevPctRef.current=0;
        saveDaily({checked:[],subtasks:{}});
        setEmailStatus("idle");
      };

      const sendSummary = async () => {
        if(emailStatus==="sending") return;
        setEmailStatus("sending");

        const name = kidName || "Player";
        const lines = [];
        config.blocks.forEach(b => {
          const done = checked.includes(b.id);
          lines.push((done?"\u2705":"\u2B1C")+"  "+b.time+" \u2014 "+b.title);
          const subs = subtasks[b.id]||[];
          subs.forEach(s => {
            lines.push("      "+(s.done?"\u2705":"\u2B1C")+" "+s.text);
          });
        });

        const params = {
          kid_name: name,
          date: formatDate(),
          progress: Math.round(pct)+"% ("+totalDone+"/"+totalBlocks+" completed)",
          report: lines.join("\n"),
        };

        try {
          await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, params, EMAILJS_KEY);
          setEmailStatus("sent");
        } catch(err) {
          console.error("EmailJS error:", err);
          setEmailStatus("error");
          setTimeout(()=>setEmailStatus("idle"),4000);
        }
      };

      const openEdit = () => setShowPin(true);
      const pinSuccess = () => {
        setShowPin(false);
        setEditBlocks(config.blocks.map(b=>({...b})));
        setEditPin(config.pin);
        setEditWeekdays(config.weekdays);
        setEditEmail(config.parentEmail||"");
        setEditName(config.kidName||"");
        setEditingBlockIdx(null);
        setNewBlock({time:"",title:"",desc:"",gated:false,addable:false});
        setEditing(true);
      };
      const saveEdit = () => {
        const cleaned = editBlocks.filter(b=>b.title.trim());
        saveConfig({blocks:cleaned,pin:editPin||DEFAULT_PIN,weekdays:editWeekdays,parentEmail:editEmail.trim(),kidName:editName.trim()});
        setEditing(false);
      };
      const addBlock = () => {
        if(!newBlock.title.trim()) return;
        setEditBlocks([...editBlocks,{...newBlock,id:"b-"+Date.now()}]);
        setNewBlock({time:"",title:"",desc:"",gated:false,addable:false});
      };
      const removeBlock = (id) => setEditBlocks(editBlocks.filter(b=>b.id!==id));
      const moveBlock = (idx,dir) => {
        const arr=[...editBlocks]; const swap=idx+dir;
        if(swap<0||swap>=arr.length) return;
        [arr[idx],arr[swap]]=[arr[swap],arr[idx]];
        setEditBlocks(arr);
      };

      const sendLabel = {idle:"SUBMIT STATS", sending:"SENDING...", sent:"SENT!", error:"FAILED \u2014 RETRY"}[emailStatus];

      return (
        <React.Fragment>
          <Confetti show={showConfetti} />
          {showPin && <PinPad correctPin={config.pin} onSuccess={pinSuccess} onCancel={()=>setShowPin(false)} />}

          <div className="min-h-screen pb-10">
            {/* HEADER - Deep Navy Athletic Vibe */}
            <div className="sticky top-0 z-40 bg-slate-900 border-b-4 border-emerald-500 shadow-xl">
              <div className="max-w-4xl mx-auto px-6 py-4 flex items-center gap-4">
                <div className="flex-1 min-w-0">
                  <h1 className="text-4xl text-white sports-header">{headerTitle}</h1>
                  <p className="text-xs font-bold text-emerald-400 uppercase tracking-widest mt-0.5">{formatDate()}</p>
                </div>
                <ProgressRing pct={pct} />
                <button onClick={openEdit} className="p-3 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all text-slate-300 border border-slate-700">
                  <I n="settings" s={22}/>
                </button>
              </div>
            </div>

            {/* DAYS */}
            <div className="max-w-4xl mx-auto px-6 mt-6 text-center">
              <span className="inline-block px-5 py-2 rounded bg-slate-200 text-sm font-bold text-slate-700 uppercase tracking-widest shadow-sm">
                {config.weekdays}
              </span>
            </div>

            {/* CELEBRATION */}
            {pct>=100 && (
              <div className="max-w-4xl mx-auto px-6 mt-6">
                <div className="rounded-lg p-5 bg-emerald-600 text-white text-center shadow-lg border-2 border-emerald-500">
                  <p className="text-2xl sports-header tracking-wide">ROSTER COMPLETE</p>
                  <p className="text-sm font-medium mt-1">Great training session{kidName?", "+kidName:""}. Submit your stats below.</p>
                </div>
              </div>
            )}

            {/* BLOCKS */}
            <div className="max-w-4xl mx-auto px-6 mt-6 space-y-4">
              {config.blocks.map((block,i) => {
                const c = BLOCK_COLORS[i%BLOCK_COLORS.length];
                const isDone = checked.includes(block.id);
                const isGated = block.gated;
                const locked = isGated && !allNonGatedDone;
                const isPopping = justChecked===block.id;
                const blockSubs = subtasks[block.id]||[];
                const isAdding = addingTo===block.id;

                return (
                  <div key={block.id} className={"rounded-lg overflow-hidden transition-all border-2 shadow-sm "+(
                    isDone?"border-emerald-500 bg-emerald-50":
                    locked?"border-slate-300 bg-slate-100 opacity-60":
                    "border-slate-300 bg-white"
                  )}>
                    {/* time bar */}
                    <div className="flex items-center gap-3 px-5 py-2.5 border-b-2 border-slate-100 bg-slate-50">
                      <div className="w-4 h-4 rounded-sm flex-shrink-0" style={{backgroundColor:c.bar}}/>
                      <span className="text-sm font-bold text-slate-500 uppercase tracking-widest">{block.time}</span>
                      {locked && (
                        <span className="ml-auto text-xs font-bold text-slate-500 flex items-center gap-1.5 uppercase tracking-wide">
                          <I n="lock" s={14}/> Complete Warmups First
                        </span>
                      )}
                      {isGated && !locked && (
                        <span className="ml-auto text-xs font-bold text-emerald-600 uppercase tracking-widest animate-pulse">Unlocked</span>
                      )}
                    </div>

                    {/* main row */}
                    <div className={"flex items-center gap-4 px-5 py-4 "+(locked?"cursor-not-allowed":"")}>
                      <div onClick={()=>!locked&&toggle(block.id,isGated)}
                        className={"w-9 h-9 rounded border-2 flex items-center justify-center flex-shrink-0 transition-all cursor-pointer "+(
                        isDone?"border-emerald-500 bg-emerald-500 "+(isPopping?"check-bounce":"")
                              :"border-slate-400 "+(locked?"cursor-not-allowed":"hover:border-slate-600 hover:bg-slate-100")
                      )}>
                        {isDone && <I n="check" s={20} c="text-white"/>}
                      </div>
                      <div className="flex-1 min-w-0" onClick={()=>!locked&&toggle(block.id,isGated)} style={{cursor:locked?"not-allowed":"pointer"}}>
                        <p className={"text-2xl sports-header transition-all "+(isDone?"line-through text-slate-400":"text-slate-800")}>
                          {block.title}
                        </p>
                        <p className={"text-sm font-medium mt-0.5 transition-all "+(isDone?"line-through text-slate-400":"text-slate-500")}>
                          {block.desc}
                        </p>
                      </div>
                      {block.addable && !locked && (
                        <button onClick={()=>{setAddingTo(isAdding?null:block.id);setNewSubText("");}}
                          className={"p-2 rounded-lg transition-all flex-shrink-0 border-2 "+(
                            isAdding?"border-slate-300 bg-slate-200 text-slate-600":"border-transparent text-slate-400 hover:border-slate-300 hover:text-slate-600 hover:bg-slate-100"
                          )}>
                          <I n={isAdding?"minus":"plus"} s={20}/>
                        </button>
                      )}
                    </div>

                    {/* subtasks */}
                    {blockSubs.length > 0 && (
                      <div className="border-t-2 border-slate-100 bg-slate-50/50">
                        {blockSubs.map(sub => (
                          <div key={sub.id} className="flex items-center gap-3 px-5 py-3 pl-[4.75rem] fade-in group">
                            <div onClick={()=>toggleSubtask(block.id,sub.id)}
                              className={"w-6 h-6 rounded-sm border-2 flex items-center justify-center flex-shrink-0 cursor-pointer transition-all "+(
                                sub.done?"border-emerald-500 bg-emerald-500":"border-slate-400 hover:border-slate-600 hover:bg-white"
                              )}>
                              {sub.done && <I n="check" s={14} c="text-white"/>}
                            </div>
                            <span className={"flex-1 text-sm font-semibold transition-all "+(sub.done?"line-through text-slate-400":"text-slate-700")}>
                              {sub.text}
                            </span>
                            <button onClick={()=>removeSubtask(block.id,sub.id)}
                              className="p-1.5 rounded text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 sm:opacity-100 transition-all">
                              <I n="x" s={16}/>
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* add subtask */}
                    {isAdding && (
                      <div className="border-t-2 border-slate-100 px-5 py-3 pl-[4.75rem] fade-in bg-slate-50">
                        <div className="flex items-center gap-3">
                          <input ref={inputRef} value={newSubText} onChange={e=>setNewSubText(e.target.value)}
                            onKeyDown={e=>{
                              if(e.key==="Enter") addSubtask(block.id);
                              if(e.key==="Escape") { setAddingTo(null); setNewSubText(""); }
                            }}
                            placeholder="Add a drill or task..."
                            autoFocus
                            className="flex-1 px-4 py-2.5 rounded border-2 border-slate-300 focus:border-slate-500 outline-none text-sm font-bold placeholder:text-slate-400 placeholder:font-medium"
                          />
                          <button onClick={()=>addSubtask(block.id)}
                            disabled={!newSubText.trim()}
                            className="px-5 py-2.5 rounded bg-slate-800 hover:bg-slate-700 disabled:bg-slate-300 text-white disabled:text-slate-500 text-sm font-bold tracking-wide uppercase transition-all">
                            Add
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* FOOTER */}
            <div className="max-w-4xl mx-auto px-6 mt-8">
              <p className="text-center text-sm font-bold text-slate-500 uppercase tracking-widest">
                Put in the work. Earn your screen time.
              </p>
            </div>

            <div className="max-w-4xl mx-auto px-6 mt-6 flex items-center justify-center gap-4">
              <button onClick={sendSummary}
                disabled={emailStatus==="sending"||emailStatus==="sent"}
                className={"flex items-center gap-2 px-8 py-3.5 rounded-lg text-lg sports-header transition-all active:scale-95 border-2 "+(
                  emailStatus==="sent"?"bg-emerald-50 text-emerald-600 border-emerald-500":
                  emailStatus==="error"?"bg-red-50 text-red-600 border-red-500":
                  emailStatus==="sending"?"bg-slate-200 text-slate-400 border-slate-200 cursor-wait":
                  "bg-slate-900 text-white border-slate-900 hover:bg-slate-800 shadow-md"
                )}>
                {emailStatus==="sending" ? (
                  <svg className="animate-spin" width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
                    <path d="M12 2v4m0 12v4m-7.07-3.93l2.83-2.83m8.48-8.48l2.83-2.83M2 12h4m12 0h4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83"/>
                  </svg>
                ) : emailStatus==="sent" ? (
                  <I n="check" s={18}/>
                ) : (
                  <I n="send" s={18}/>
                )}
                {sendLabel}
              </button>
              <button onClick={resetDay}
                className="flex items-center gap-2 px-5 py-3.5 rounded-lg bg-white hover:bg-slate-50 border-2 border-slate-300 text-slate-500 text-sm font-bold uppercase tracking-wider transition-all active:scale-95">
                <I n="reset" s={16}/> Reset
              </button>
            </div>
          </div>

          {/* SETTINGS - Updated to match athletic vibe */}
          {editing && (
            <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-end sm:items-center justify-center"
              onClick={()=>setEditing(false)}>
              <div className="bg-slate-50 rounded-t-xl sm:rounded-xl w-full max-w-xl max-h-[85vh] overflow-y-auto shadow-2xl modal-slide border-2 border-slate-300"
                onClick={e=>e.stopPropagation()}>
                <div className="sticky top-0 bg-white/95 backdrop-blur-xl z-10 px-6 pt-6 pb-4 border-b-2 border-slate-200 flex items-center">
                  <h2 className="text-2xl sports-header text-slate-800 flex-1">Team Settings</h2>
                  <button onClick={()=>setEditing(false)} className="p-2 rounded-lg hover:bg-slate-100 text-slate-500"><I n="x" s={24}/></button>
                </div>

                <div className="p-6 space-y-7">
                  <div>
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Player Name</label>
                    <input value={editName} onChange={e=>setEditName(e.target.value)}
                      className="mt-2 w-full px-4 py-3 rounded border-2 border-slate-300 focus:border-slate-500 outline-none text-base font-semibold"
                      placeholder="Name (shows in header)"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Coach Email</label>
                    <input value={editEmail} onChange={e=>setEditEmail(e.target.value)} type="email"
                      className="mt-2 w-full px-4 py-3 rounded border-2 border-slate-300 focus:border-slate-500 outline-none text-base font-semibold"
                      placeholder="coach@email.com"
                    />
                    <p className="text-xs font-medium text-slate-400 mt-1 uppercase">Daily stat summaries go here</p>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Schedule Label</label>
                    <input value={editWeekdays} onChange={e=>setEditWeekdays(e.target.value)}
                      className="mt-2 w-full px-4 py-3 rounded border-2 border-slate-300 focus:border-slate-500 outline-none text-base font-semibold"
                      placeholder="e.g. MATCH DAYS: MON - FRI"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Security PIN</label>
                    <input value={editPin} onChange={e=>setEditPin(e.target.value.replace(/\D/g,"").slice(0,6))}
                      type="text" inputMode="numeric" maxLength={6}
                      className="mt-2 w-full px-4 py-3 rounded border-2 border-slate-300 focus:border-slate-500 outline-none text-xl sports-header tracking-[0.2em] text-center"
                      placeholder="1234"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Training Blocks</label>
                    <div className="mt-3 space-y-2">
                      {editBlocks.map((block,i)=>(
                        <div key={block.id} className={"rounded border-2 p-4 "+(block.gated?"border-indigo-300 bg-indigo-50/50":"border-slate-300 bg-white")}>
                          {editingBlockIdx===i ? (
                            <div className="space-y-3">
                              <input value={block.time} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],time:e.target.value};setEditBlocks(b);}}
                                placeholder="Time" className="w-full px-4 py-2.5 rounded border-2 border-slate-200 text-sm font-semibold outline-none focus:border-slate-400"/>
                              <input value={block.title} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],title:e.target.value};setEditBlocks(b);}}
                                placeholder="Title" className="w-full px-4 py-2.5 rounded border-2 border-slate-200 text-sm font-semibold outline-none focus:border-slate-400"/>
                              <input value={block.desc} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],desc:e.target.value};setEditBlocks(b);}}
                                placeholder="Description" className="w-full px-4 py-2.5 rounded border-2 border-slate-200 text-sm font-semibold outline-none focus:border-slate-400"/>
                              <div className="flex items-center gap-5 flex-wrap">
                                <label className="flex items-center gap-2 text-sm font-bold text-slate-600 cursor-pointer uppercase">
                                  <input type="checkbox" checked={block.gated} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],gated:e.target.checked};setEditBlocks(b);}} className="rounded-sm w-4 h-4"/> Must Earn
                                </label>
                                <label className="flex items-center gap-2 text-sm font-bold text-slate-600 cursor-pointer uppercase">
                                  <input type="checkbox" checked={block.addable} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],addable:e.target.checked};setEditBlocks(b);}} className="rounded-sm w-4 h-4"/> + Tasks
                                </label>
                                <button onClick={()=>setEditingBlockIdx(null)} className="ml-auto px-5 py-2 rounded bg-slate-800 text-white text-sm font-bold uppercase tracking-wider">Done</button>
                              </div>
                            </div>
                          ) : (
                            <div className="flex items-center gap-3">
                              <div className="flex flex-col gap-1 flex-shrink-0">
                                <button onClick={()=>moveBlock(i,-1)} className="text-sm text-slate-300 hover:text-slate-600 leading-none">{"\u25B2"}</button>
                                <button onClick={()=>moveBlock(i,1)} className="text-sm text-slate-300 hover:text-slate-600 leading-none">{"\u25BC"}</button>
                              </div>
                              <div className="flex-1 min-w-0 cursor-pointer" onClick={()=>setEditingBlockIdx(i)}>
                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">{block.time}</p>
                                <p className="text-lg sports-header text-slate-800 truncate">{block.title}</p>
                                <div className="flex gap-3 mt-0.5">
                                  {block.gated && <span className="text-xs font-bold text-indigo-500 uppercase tracking-wide">Earned</span>}
                                  {block.addable && <span className="text-xs font-bold text-emerald-600 uppercase tracking-wide">+ Tasks</span>}
                                </div>
                              </div>
                              <button onClick={()=>setEditingBlockIdx(i)} className="p-2 rounded hover:bg-slate-100 text-slate-400 hover:text-slate-700 border-2 border-transparent hover:border-slate-200"><I n="edit" s={18}/></button>
                              <button onClick={()=>removeBlock(block.id)} className="p-2 rounded hover:bg-red-50 text-slate-400 hover:text-red-500 border-2 border-transparent hover:border-red-200"><I n="trash" s={18}/></button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>

                    <div className="mt-4 rounded border-2 border-dashed border-slate-300 p-4 space-y-3 bg-white">
                      <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Add New Block</p>
                      <input value={newBlock.time} onChange={e=>setNewBlock({...newBlock,time:e.target.value})}
                        placeholder="Time" className="w-full px-4 py-2.5 rounded border-2 border-slate-200 text-sm font-semibold outline-none focus:border-slate-400"/>
                      <input value={newBlock.title} onChange={e=>setNewBlock({...newBlock,title:e.target.value})}
                        placeholder="Title" className="w-full px-4 py-2.5 rounded border-2 border-slate-200 text-sm font-semibold outline-none focus:border-slate-400"/>
                      <input value={newBlock.desc} onChange={e=>setNewBlock({...newBlock,desc:e.target.value})}
                        placeholder="Description" className="w-full px-4 py-2.5 rounded border-2 border-slate-200 text-sm font-semibold outline-none focus:border-slate-400"/>
                      <div className="flex items-center gap-5 flex-wrap">
                        <label className="flex items-center gap-2 text-sm font-bold text-slate-600 cursor-pointer uppercase">
                          <input type="checkbox" checked={newBlock.gated} onChange={e=>setNewBlock({...newBlock,gated:e.target.checked})} className="rounded-sm w-4 h-4"/> Must Earn
                        </label>
                        <label className="flex items-center gap-2 text-sm font-bold text-slate-600 cursor-pointer uppercase">
                          <input type="checkbox" checked={newBlock.addable} onChange={e=>setNewBlock({...newBlock,addable:e.target.checked})} className="rounded-sm w-4 h-4"/> + Tasks
                        </label>
                        <button onClick={addBlock} className="ml-auto px-5 py-2 rounded bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold uppercase tracking-wider transition-all">Add Block</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="sticky bottom-0 p-6 bg-white/95 backdrop-blur-xl border-t-2 border-slate-200">
                  <button onClick={saveEdit}
                    className="w-full py-4 rounded bg-slate-900 hover:bg-slate-800 text-white text-xl sports-header shadow-md active:scale-[0.98] transition-all">
                    SAVE CHANGES
                  </button>
                </div>
              </div>
            </div>
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
