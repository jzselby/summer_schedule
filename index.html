<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Summer Schedule" />
  <title>Summer Schedule</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overscroll-behavior: none; font-family: 'DM Sans', system-ui, sans-serif; }
    @keyframes confettiFall {
      0% { opacity:1; transform:translateY(0) rotate(0deg); }
      100% { opacity:0; transform:translateY(100vh) rotate(720deg); }
    }
    @keyframes bounceCheck {
      0% { transform:scale(1); } 30% { transform:scale(1.15); }
      60% { transform:scale(0.95); } 100% { transform:scale(1); }
    }
    @keyframes slideUp {
      from { transform:translateY(100%); opacity:0; }
      to { transform:translateY(0); opacity:1; }
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(4px); }
      to { opacity:1; transform:translateY(0); }
    }
    .check-bounce { animation: bounceCheck 0.35s ease-out; }
    .modal-slide { animation: slideUp 0.3s ease-out; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    textarea, input { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    const getToday = () => {
      const d = new Date();
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    };
    const formatDate = () =>
      new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

    const load = (k,fb) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):fb; } catch{ return fb; } };
    const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch{} };

    const DEFAULT_PIN = "1234";

    const BLOCK_COLORS = [
      {bar:"#d97706"},{bar:"#2563eb"},{bar:"#7c3aed"},{bar:"#059669"},
      {bar:"#dc2626"},{bar:"#0891b2"},{bar:"#4f46e5"},{bar:"#be185d"},
    ];

    const DEFAULT_BLOCKS = [
      { id:"wake",   time:"8:30 \u2013 9:30",  title:"Wake Up & Morning Routine", desc:"Shower, breakfast, get dressed, brush teeth", gated:false, addable:false },
      { id:"chores", time:"9:30 \u2013 10:00", title:"Quick Chores",              desc:"Dishwasher, wipe counters, make beds, daily task", gated:false, addable:true },
      { id:"brain",  time:"10:00 \u2013 11:00",title:"Brain Power Hour",          desc:"Coding, Spanish, or math games", gated:false, addable:true },
      { id:"read",   time:"11:00 \u2013 12:00",title:"Reading Time",              desc:"Downtime with a book \u2014 no devices", gated:false, addable:false },
      { id:"lunch",  time:"12:00 \u2013 1:00", title:"Lunch & Reset",             desc:"Make lunch, clean up after yourself", gated:false, addable:false },
      { id:"open",   time:"1:00 \u2013 3:30",  title:"Open Window",               desc:"Friends, outside, basketball, board games, Lego, drawing", gated:false, addable:false },
      { id:"screen", time:"3:30 \u2013 4:30",  title:"Screen Time Hour",          desc:"Video games, YouTube, or TV", gated:true, addable:false },
      { id:"family", time:"4:30 onward",       title:"Family Time & Free Play",   desc:"Dinner, activities, hang out", gated:false, addable:false },
    ];

    const DEFAULT_CONFIG = {
      blocks: DEFAULT_BLOCKS,
      pin: DEFAULT_PIN,
      weekdays: "MONDAY \u2013 FRIDAY",
      parentEmail: "",
      kidName: "",
    };

    /* Icons */
    const I = ({n,s=18,c=""}) => {
      const p = {
        check:<polyline points="20 6 9 17 4 12"/>,
        lock:<React.Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></React.Fragment>,
        settings:<React.Fragment><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></React.Fragment>,
        x:<React.Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></React.Fragment>,
        reset:<React.Fragment><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></React.Fragment>,
        edit:<React.Fragment><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></React.Fragment>,
        trash:<React.Fragment><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></React.Fragment>,
        send:<React.Fragment><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></React.Fragment>,
        plus:<React.Fragment><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></React.Fragment>,
        minus:<line x1="5" y1="12" x2="19" y2="12"/>,
      };
      return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}>{p[n]}</svg>;
    };

    /* Confetti */
    function Confetti({show}) {
      if(!show) return null;
      const colors=["#d97706","#2563eb","#059669","#7c3aed","#dc2626","#0891b2"];
      return (
        <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
          {Array.from({length:40},(_,i)=>(
            <div key={i} className="absolute" style={{
              left:Math.random()*100+"%",top:"-10px",
              width:5+Math.random()*6,height:(5+Math.random()*6)*0.5,
              backgroundColor:colors[i%colors.length],borderRadius:1,opacity:0,
              animation:"confettiFall "+(1.8+Math.random()*1.2)+"s "+Math.random()*0.5+"s ease-out forwards",
              transform:"rotate("+Math.random()*720+"deg)",
            }}/>
          ))}
        </div>
      );
    }

    /* Progress Ring */
    function ProgressRing({pct,size=56,stroke=5}) {
      const r=(size-stroke)/2, circ=2*Math.PI*r;
      const offset=circ-(pct/100)*circ;
      const color=pct>=100?"#059669":pct>=50?"#2563eb":"#d97706";
      return (
        <svg width={size} height={size} className="transform -rotate-90">
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#f3f4f6" strokeWidth={stroke}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
            strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={offset}
            strokeLinecap="round" style={{transition:"stroke-dashoffset 0.5s ease, stroke 0.3s"}}/>
          <text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="central"
            fill="#374151" fontWeight="600" fontSize={size*0.24}
            style={{transform:"rotate(90deg)",transformOrigin:"center"}}>
            {Math.round(pct)}%
          </text>
        </svg>
      );
    }

    /* PIN Pad */
    function PinPad({onSuccess,onCancel,correctPin}) {
      const [entry,setEntry] = useState("");
      const [error,setError] = useState(false);
      const press = (n) => {
        if(entry.length>=6) return;
        const next=entry+n; setError(false);
        if(next.length===correctPin.length) {
          if(next===correctPin) onSuccess();
          else { setError(true); setTimeout(()=>{setEntry("");setError(false);},600); }
        } else setEntry(next);
      };
      return (
        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center" onClick={onCancel}>
          <div className="bg-white rounded-2xl p-6 w-72 shadow-2xl modal-slide" onClick={e=>e.stopPropagation()}>
            <h3 className="text-center text-base font-semibold text-gray-800 mb-1">Parent Access</h3>
            <p className="text-center text-sm text-gray-400 mb-5">Enter your PIN</p>
            <div className="flex justify-center gap-3 mb-6">
              {Array.from({length:correctPin.length},(_,i)=>(
                <div key={i} className={"w-3 h-3 rounded-full transition-all "+(error?"bg-red-400":i<entry.length?"bg-gray-800":"bg-gray-200")}/>
              ))}
            </div>
            <div className="grid grid-cols-3 gap-2 max-w-[220px] mx-auto">
              {[1,2,3,4,5,6,7,8,9].map(n=>(
                <button key={n} onClick={()=>press(String(n))} className="h-12 rounded-xl bg-gray-50 hover:bg-gray-100 active:bg-gray-200 text-lg font-semibold text-gray-700 transition-all active:scale-95">{n}</button>
              ))}
              <button onClick={onCancel} className="h-12 rounded-xl text-xs font-medium text-gray-400 hover:bg-gray-50">Cancel</button>
              <button onClick={()=>press("0")} className="h-12 rounded-xl bg-gray-50 hover:bg-gray-100 active:bg-gray-200 text-lg font-semibold text-gray-700 transition-all active:scale-95">0</button>
              <button onClick={()=>{setEntry(entry.slice(0,-1));setError(false);}} className="h-12 rounded-xl text-lg text-gray-400 hover:bg-gray-50">&#9003;</button>
            </div>
          </div>
        </div>
      );
    }

    /* Main */
    function App() {
      const today = getToday();
      const dailyKey = "ss-daily-"+today;

      const [config, setConfig] = useState(() => load("ss-config-v5", DEFAULT_CONFIG));
      const [daily, setDaily] = useState(() => load(dailyKey, { checked:[], subtasks:{} }));
      const [showPin, setShowPin] = useState(false);
      const [editing, setEditing] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const [justChecked, setJustChecked] = useState(null);
      const [addingTo, setAddingTo] = useState(null);
      const [newSubText, setNewSubText] = useState("");
      const [emailSent, setEmailSent] = useState(false);

      const [editBlocks, setEditBlocks] = useState([]);
      const [editPin, setEditPin] = useState("");
      const [editWeekdays, setEditWeekdays] = useState("");
      const [editEmail, setEditEmail] = useState("");
      const [editName, setEditName] = useState("");
      const [newBlock, setNewBlock] = useState({time:"",title:"",desc:"",gated:false,addable:false});
      const [editingBlockIdx, setEditingBlockIdx] = useState(null);

      const prevPctRef = useRef(0);
      const inputRef = useRef(null);

      const saveConfig = (c) => { setConfig(c); save("ss-config-v5",c); };
      const saveDaily = (d) => { setDaily(d); save(dailyKey,d); };

      const checked = daily.checked || [];
      // subtasks: { blockId: [{id, text, done}] }
      const subtasks = daily.subtasks || {};
      const nonGated = config.blocks.filter(b=>!b.gated);
      const allNonGatedDone = nonGated.every(b=>checked.includes(b.id));
      const totalBlocks = config.blocks.length;
      const totalDone = checked.length;
      const pct = totalBlocks>0?(totalDone/totalBlocks)*100:0;

      const kidName = config.kidName || "";
      const headerTitle = kidName ? kidName+"'s Schedule" : "Summer Schedule";

      const toggle = (blockId, isGated) => {
        if(isGated && !allNonGatedDone) return;
        const curr = [...checked];
        const idx = curr.indexOf(blockId);
        if(idx>=0) { curr.splice(idx,1); }
        else {
          curr.push(blockId);
          setJustChecked(blockId);
          setTimeout(()=>setJustChecked(null),500);
        }
        const newDaily = {...daily, checked:curr};
        const newPct = totalBlocks>0?(curr.length/totalBlocks)*100:0;
        if(newPct>=100 && prevPctRef.current<100) {
          setShowConfetti(true);
          setTimeout(()=>setShowConfetti(false),3500);
        }
        prevPctRef.current=newPct;
        saveDaily(newDaily);
      };

      /* Subtask helpers */
      const addSubtask = (blockId) => {
        if(!newSubText.trim()) return;
        const blockSubs = [...(subtasks[blockId]||[])];
        blockSubs.push({ id:"s-"+Date.now(), text:newSubText.trim(), done:false });
        const newSubs = {...subtasks, [blockId]:blockSubs};
        saveDaily({...daily, subtasks:newSubs});
        setNewSubText("");
        // keep input focused for rapid entry
        setTimeout(()=>inputRef.current&&inputRef.current.focus(),50);
      };

      const toggleSubtask = (blockId, subId) => {
        const blockSubs = (subtasks[blockId]||[]).map(s =>
          s.id===subId ? {...s, done:!s.done} : s
        );
        saveDaily({...daily, subtasks:{...subtasks, [blockId]:blockSubs}});
      };

      const removeSubtask = (blockId, subId) => {
        const blockSubs = (subtasks[blockId]||[]).filter(s=>s.id!==subId);
        saveDaily({...daily, subtasks:{...subtasks, [blockId]:blockSubs}});
      };

      const resetDay = () => {
        prevPctRef.current=0;
        saveDaily({checked:[],subtasks:{}});
        setEmailSent(false);
      };

      /* Email */
      const sendSummary = () => {
        const lines = [];
        const name = kidName || "Kid";
        lines.push("SUMMER SCHEDULE \u2014 "+name);
        lines.push(formatDate());
        lines.push("Progress: "+Math.round(pct)+"% ("+totalDone+"/"+totalBlocks+" blocks)");
        lines.push("");
        config.blocks.forEach(b => {
          const done = checked.includes(b.id);
          lines.push((done?"[DONE]":"[    ]")+" "+b.time+" \u2014 "+b.title);
          const subs = subtasks[b.id]||[];
          subs.forEach(s => {
            lines.push("   "+(s.done?"[x]":"[ ]")+" "+s.text);
          });
        });
        lines.push("");
        lines.push("---");
        lines.push("Sent from Summer Schedule");
        const subject = encodeURIComponent(name+"'s Schedule \u2014 "+formatDate()+" \u2014 "+Math.round(pct)+"%");
        const body = encodeURIComponent(lines.join("\n"));
        window.open("mailto:"+(config.parentEmail||"")+"?subject="+subject+"&body="+body,"_blank");
        setEmailSent(true);
      };

      /* Settings */
      const openEdit = () => setShowPin(true);
      const pinSuccess = () => {
        setShowPin(false);
        setEditBlocks(config.blocks.map(b=>({...b})));
        setEditPin(config.pin);
        setEditWeekdays(config.weekdays);
        setEditEmail(config.parentEmail||"");
        setEditName(config.kidName||"");
        setEditingBlockIdx(null);
        setNewBlock({time:"",title:"",desc:"",gated:false,addable:false});
        setEditing(true);
      };
      const saveEdit = () => {
        const cleaned = editBlocks.filter(b=>b.title.trim());
        saveConfig({
          blocks:cleaned,
          pin:editPin||DEFAULT_PIN,
          weekdays:editWeekdays,
          parentEmail:editEmail.trim(),
          kidName:editName.trim(),
        });
        setEditing(false);
      };
      const addBlock = () => {
        if(!newBlock.title.trim()) return;
        setEditBlocks([...editBlocks,{...newBlock,id:"b-"+Date.now()}]);
        setNewBlock({time:"",title:"",desc:"",gated:false,addable:false});
      };
      const removeBlock = (id) => setEditBlocks(editBlocks.filter(b=>b.id!==id));
      const moveBlock = (idx,dir) => {
        const arr=[...editBlocks]; const swap=idx+dir;
        if(swap<0||swap>=arr.length) return;
        [arr[idx],arr[swap]]=[arr[swap],arr[idx]];
        setEditBlocks(arr);
      };

      return (
        <React.Fragment>
          <Confetti show={showConfetti} />
          {showPin && <PinPad correctPin={config.pin} onSuccess={pinSuccess} onCancel={()=>setShowPin(false)} />}

          <div className="min-h-screen pb-8" style={{background:"#f8f8f6"}}>
            {/* HEADER */}
            <div className="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-gray-100 shadow-sm">
              <div className="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
                <div className="flex-1 min-w-0">
                  <h1 className="text-xl font-bold text-gray-800 tracking-tight">{headerTitle}</h1>
                  <p className="text-xs text-gray-400 font-medium mt-0.5">{formatDate()}</p>
                </div>
                <ProgressRing pct={pct} />
                <button onClick={openEdit} className="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 active:scale-95 transition-all text-gray-500">
                  <I n="settings" s={18}/>
                </button>
              </div>
            </div>

            {/* DAYS */}
            <div className="max-w-2xl mx-auto px-4 mt-4 text-center">
              <span className="inline-block px-3 py-1 rounded-md bg-white text-xs font-semibold text-gray-400 uppercase tracking-widest border border-gray-100">
                {config.weekdays}
              </span>
            </div>

            {/* CELEBRATION */}
            {pct>=100 && (
              <div className="max-w-2xl mx-auto px-4 mt-4">
                <div className="rounded-xl p-4 bg-emerald-600 text-white text-center shadow-md">
                  <p className="text-base font-semibold">All done for today!</p>
                  <p className="text-sm opacity-80 mt-0.5">Great work{kidName?", "+kidName:""}. Don't forget to send your summary.</p>
                </div>
              </div>
            )}

            {/* BLOCKS */}
            <div className="max-w-2xl mx-auto px-4 mt-4 space-y-2.5">
              {config.blocks.map((block,i) => {
                const c = BLOCK_COLORS[i%BLOCK_COLORS.length];
                const isDone = checked.includes(block.id);
                const isGated = block.gated;
                const locked = isGated && !allNonGatedDone;
                const isPopping = justChecked===block.id;
                const blockSubs = subtasks[block.id]||[];
                const isAdding = addingTo===block.id;

                return (
                  <div key={block.id} className={"rounded-xl overflow-hidden transition-all border "+(
                    isDone?"border-emerald-200 bg-emerald-50/50":
                    locked?"border-gray-200 bg-white opacity-50":
                    "border-gray-200 bg-white"
                  )}>
                    {/* time bar */}
                    <div className="flex items-center gap-2.5 px-4 py-2 border-b border-gray-100">
                      <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{backgroundColor:c.bar}}/>
                      <span className="text-xs font-semibold text-gray-400 uppercase tracking-wide">{block.time}</span>
                      {locked && (
                        <span className="ml-auto text-xs text-gray-400 flex items-center gap-1">
                          <I n="lock" s={12}/> Complete other blocks first
                        </span>
                      )}
                      {isGated && !locked && (
                        <span className="ml-auto text-xs text-emerald-500 font-medium">Unlocked</span>
                      )}
                    </div>

                    {/* main row */}
                    <div className={"flex items-center gap-3 px-4 py-3 "+(locked?"cursor-not-allowed":"")}>
                      <div onClick={()=>!locked&&toggle(block.id,isGated)}
                        className={"w-6 h-6 rounded-md border-2 flex items-center justify-center flex-shrink-0 transition-all cursor-pointer "+(
                        isDone?"border-emerald-500 bg-emerald-500 "+(isPopping?"check-bounce":"")
                              :"border-gray-300 "+(locked?"cursor-not-allowed":"hover:border-gray-400")
                      )}>
                        {isDone && <I n="check" s={14} c="text-white"/>}
                      </div>
                      <div className="flex-1 min-w-0" onClick={()=>!locked&&toggle(block.id,isGated)} style={{cursor:locked?"not-allowed":"pointer"}}>
                        <p className={"text-sm font-semibold transition-all "+(isDone?"line-through text-gray-400":"text-gray-800")}>
                          {block.title}
                        </p>
                        <p className={"text-xs mt-0.5 transition-all "+(isDone?"line-through text-gray-300":"text-gray-400")}>
                          {block.desc}
                        </p>
                      </div>
                      {block.addable && !locked && (
                        <button onClick={()=>{setAddingTo(isAdding?null:block.id);setNewSubText("");}}
                          className={"p-1.5 rounded-lg transition-all flex-shrink-0 "+(
                            isAdding?"text-gray-500 bg-gray-100":"text-gray-300 hover:text-gray-500 hover:bg-gray-50"
                          )}>
                          <I n={isAdding?"minus":"plus"} s={16}/>
                        </button>
                      )}
                    </div>

                    {/* subtasks */}
                    {blockSubs.length > 0 && (
                      <div className="border-t border-gray-100">
                        {blockSubs.map(sub => (
                          <div key={sub.id} className="flex items-center gap-3 px-4 py-2 pl-14 fade-in group">
                            <div onClick={()=>toggleSubtask(block.id,sub.id)}
                              className={"w-4 h-4 rounded border-2 flex items-center justify-center flex-shrink-0 cursor-pointer transition-all "+(
                                sub.done?"border-emerald-400 bg-emerald-400":"border-gray-300 hover:border-gray-400"
                              )}>
                              {sub.done && <I n="check" s={10} c="text-white"/>}
                            </div>
                            <span className={"flex-1 text-xs font-medium transition-all "+(sub.done?"line-through text-gray-300":"text-gray-600")}>
                              {sub.text}
                            </span>
                            <button onClick={()=>removeSubtask(block.id,sub.id)}
                              className="p-1 rounded text-gray-200 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all sm:opacity-100">
                              <I n="x" s={12}/>
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* add subtask input */}
                    {isAdding && (
                      <div className="border-t border-gray-100 px-4 py-2.5 pl-14 fade-in">
                        <div className="flex items-center gap-2">
                          <input
                            ref={inputRef}
                            value={newSubText}
                            onChange={e=>setNewSubText(e.target.value)}
                            onKeyDown={e=>{
                              if(e.key==="Enter") addSubtask(block.id);
                              if(e.key==="Escape") { setAddingTo(null); setNewSubText(""); }
                            }}
                            placeholder={"Add a task..."}
                            autoFocus
                            className="flex-1 px-3 py-1.5 rounded-md border border-gray-200 focus:border-gray-400 outline-none text-xs font-medium placeholder:text-gray-300"
                          />
                          <button onClick={()=>addSubtask(block.id)}
                            disabled={!newSubText.trim()}
                            className="px-3 py-1.5 rounded-md bg-gray-800 hover:bg-gray-700 disabled:bg-gray-200 text-white disabled:text-gray-400 text-xs font-medium transition-all">
                            Add
                          </button>
                        </div>
                        <p className="text-xs text-gray-300 mt-1">Press Enter to add, Escape to close</p>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* FOOTER */}
            <div className="max-w-2xl mx-auto px-4 mt-5">
              <p className="text-center text-xs font-medium text-gray-400">
                Earn your screen time \u2014 do the work first.
              </p>
            </div>

            <div className="max-w-2xl mx-auto px-4 mt-4 flex items-center justify-center gap-3">
              <button onClick={sendSummary}
                className={"flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all active:scale-95 "+(
                  emailSent?"bg-emerald-50 text-emerald-600 border border-emerald-200"
                           :"bg-gray-800 text-white hover:bg-gray-700 shadow-sm"
                )}>
                <I n="send" s={14}/> {emailSent?"Summary Sent":"Send Summary"}
              </button>
              <button onClick={resetDay}
                className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-white hover:bg-gray-50 border border-gray-200 text-gray-400 text-xs font-medium transition-all active:scale-95">
                <I n="reset" s={12}/> Reset
              </button>
            </div>
          </div>

          {/* SETTINGS */}
          {editing && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center"
              onClick={()=>setEditing(false)}>
              <div className="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[85vh] overflow-y-auto shadow-2xl modal-slide"
                onClick={e=>e.stopPropagation()}>
                <div className="sticky top-0 bg-white/95 backdrop-blur-xl z-10 px-5 pt-5 pb-3 border-b border-gray-100 flex items-center">
                  <h2 className="text-lg font-semibold text-gray-800 flex-1">Settings</h2>
                  <button onClick={()=>setEditing(false)} className="p-2 rounded-lg hover:bg-gray-100 text-gray-400"><I n="x" s={18}/></button>
                </div>

                <div className="p-5 space-y-6">
                  {/* Name */}
                  <div>
                    <label className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Kid's Name</label>
                    <input value={editName} onChange={e=>setEditName(e.target.value)}
                      className="mt-2 w-full px-3 py-2.5 rounded-lg border border-gray-200 focus:border-gray-400 outline-none text-sm font-medium"
                      placeholder="Name (shows in header)"
                    />
                  </div>

                  {/* Email */}
                  <div>
                    <label className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Parent Email</label>
                    <input value={editEmail} onChange={e=>setEditEmail(e.target.value)} type="email"
                      className="mt-2 w-full px-3 py-2.5 rounded-lg border border-gray-200 focus:border-gray-400 outline-none text-sm font-medium"
                      placeholder="parent@email.com"
                    />
                    <p className="text-xs text-gray-300 mt-1">Daily summaries go here</p>
                  </div>

                  {/* Days */}
                  <div>
                    <label className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Days Label</label>
                    <input value={editWeekdays} onChange={e=>setEditWeekdays(e.target.value)}
                      className="mt-2 w-full px-3 py-2.5 rounded-lg border border-gray-200 focus:border-gray-400 outline-none text-sm font-medium"
                      placeholder="e.g. MONDAY - FRIDAY"
                    />
                  </div>

                  {/* PIN */}
                  <div>
                    <label className="text-xs font-semibold text-gray-400 uppercase tracking-wide">PIN</label>
                    <input value={editPin} onChange={e=>setEditPin(e.target.value.replace(/\D/g,"").slice(0,6))}
                      type="text" inputMode="numeric" maxLength={6}
                      className="mt-2 w-full px-3 py-2.5 rounded-lg border border-gray-200 focus:border-gray-400 outline-none text-sm font-medium tracking-widest text-center"
                      placeholder="1234"
                    />
                  </div>

                  {/* Blocks */}
                  <div>
                    <label className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Schedule Blocks</label>
                    <div className="mt-2 space-y-2">
                      {editBlocks.map((block,i)=>(
                        <div key={block.id} className={"rounded-lg border p-3 "+(block.gated?"border-indigo-200 bg-indigo-50/30":"border-gray-200 bg-gray-50/50")}>
                          {editingBlockIdx===i ? (
                            <div className="space-y-2">
                              <input value={block.time} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],time:e.target.value};setEditBlocks(b);}}
                                placeholder="Time" className="w-full px-3 py-2 rounded-md border border-gray-200 text-sm outline-none focus:border-gray-400"/>
                              <input value={block.title} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],title:e.target.value};setEditBlocks(b);}}
                                placeholder="Title" className="w-full px-3 py-2 rounded-md border border-gray-200 text-sm outline-none focus:border-gray-400"/>
                              <input value={block.desc} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],desc:e.target.value};setEditBlocks(b);}}
                                placeholder="Description" className="w-full px-3 py-2 rounded-md border border-gray-200 text-sm outline-none focus:border-gray-400"/>
                              <div className="flex items-center gap-4 flex-wrap">
                                <label className="flex items-center gap-2 text-xs text-gray-500 cursor-pointer">
                                  <input type="checkbox" checked={block.gated} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],gated:e.target.checked};setEditBlocks(b);}} className="rounded"/> Must earn
                                </label>
                                <label className="flex items-center gap-2 text-xs text-gray-500 cursor-pointer">
                                  <input type="checkbox" checked={block.addable} onChange={e=>{const b=[...editBlocks];b[i]={...b[i],addable:e.target.checked};setEditBlocks(b);}} className="rounded"/> Kids can add tasks
                                </label>
                                <button onClick={()=>setEditingBlockIdx(null)} className="ml-auto px-3 py-1 rounded-md bg-gray-800 text-white text-xs font-medium">Done</button>
                              </div>
                            </div>
                          ) : (
                            <div className="flex items-center gap-2">
                              <div className="flex flex-col gap-0.5 flex-shrink-0">
                                <button onClick={()=>moveBlock(i,-1)} className="text-xs text-gray-300 hover:text-gray-500 leading-none">{"\u25B2"}</button>
                                <button onClick={()=>moveBlock(i,1)} className="text-xs text-gray-300 hover:text-gray-500 leading-none">{"\u25BC"}</button>
                              </div>
                              <div className="flex-1 min-w-0 cursor-pointer" onClick={()=>setEditingBlockIdx(i)}>
                                <p className="text-xs font-medium text-gray-400">{block.time}</p>
                                <p className="text-sm font-semibold text-gray-700 truncate">{block.title}</p>
                                <div className="flex gap-2 mt-0.5">
                                  {block.gated && <span className="text-xs text-indigo-400">Earned</span>}
                                  {block.addable && <span className="text-xs text-blue-400">+ Tasks</span>}
                                </div>
                              </div>
                              <button onClick={()=>setEditingBlockIdx(i)} className="p-1.5 rounded-md hover:bg-gray-100 text-gray-300 hover:text-gray-500"><I n="edit" s={14}/></button>
                              <button onClick={()=>removeBlock(block.id)} className="p-1.5 rounded-md hover:bg-red-50 text-gray-300 hover:text-red-400"><I n="trash" s={14}/></button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>

                    <div className="mt-3 rounded-lg border border-dashed border-gray-300 p-3 space-y-2">
                      <p className="text-xs font-medium text-gray-400">Add New Block</p>
                      <input value={newBlock.time} onChange={e=>setNewBlock({...newBlock,time:e.target.value})}
                        placeholder="Time" className="w-full px-3 py-2 rounded-md border border-gray-200 text-sm outline-none focus:border-gray-400"/>
                      <input value={newBlock.title} onChange={e=>setNewBlock({...newBlock,title:e.target.value})}
                        placeholder="Title" className="w-full px-3 py-2 rounded-md border border-gray-200 text-sm outline-none focus:border-gray-400"/>
                      <input value={newBlock.desc} onChange={e=>setNewBlock({...newBlock,desc:e.target.value})}
                        placeholder="Description" className="w-full px-3 py-2 rounded-md border border-gray-200 text-sm outline-none focus:border-gray-400"/>
                      <div className="flex items-center gap-4 flex-wrap">
                        <label className="flex items-center gap-2 text-xs text-gray-500 cursor-pointer">
                          <input type="checkbox" checked={newBlock.gated} onChange={e=>setNewBlock({...newBlock,gated:e.target.checked})} className="rounded"/> Must earn
                        </label>
                        <label className="flex items-center gap-2 text-xs text-gray-500 cursor-pointer">
                          <input type="checkbox" checked={newBlock.addable} onChange={e=>setNewBlock({...newBlock,addable:e.target.checked})} className="rounded"/> Kids can add tasks
                        </label>
                        <button onClick={addBlock} className="ml-auto px-4 py-1.5 rounded-md bg-gray-800 hover:bg-gray-700 text-white text-xs font-medium transition-all">Add Block</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="sticky bottom-0 p-5 bg-white/95 backdrop-blur-xl border-t border-gray-100">
                  <button onClick={saveEdit}
                    className="w-full py-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-white font-semibold text-sm shadow-sm active:scale-[0.98] transition-all">
                    Save Changes
                  </button>
                </div>
              </div>
            </div>
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
